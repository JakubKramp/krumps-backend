name: Code Quality
on: [push]
jobs:

  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group ci
      - run: uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group ci
      - run: uv run ty check

  bandit-check:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          severity: high

  tests:
    runs-on: ubuntu-latest
    needs: [ruff-lint, type-check, bandit-check]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment file
        run: |
              cp config/env.example config/.env
              echo "Created config/.env"
      - name: Build the image
        run: docker compose build
      - name: Run tests
        run: docker compose -f docker-compose-ci.yml run api pytest --cov=. --cov-fail-under=85

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read
    steps:
    - name: Check out repo
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image tag
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      run: |
        IMAGE_TAG="$REGISTRY/$REPOSITORY:${{ github.sha }}"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Build and Push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          PLAYWRIGHT_ENABLED=true
        tags: |
              ${{ env.IMAGE_TAG }}
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VM_IP }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          set -e
          cd ~/FastAPI_cookbook
          git pull --ff-only
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          docker compose -f docker-compose-prod.yml pull
          docker compose -f docker-compose-prod.yml up -d --remove-orphans