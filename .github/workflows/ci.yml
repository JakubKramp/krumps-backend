name: Code Quality
on: [push]
jobs:

  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group ci
      - run: uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --only-group ci
      - run: uv run ty check

  bandit-check:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          severity: high

  tests:
    runs-on: ubuntu-latest
    needs: [ruff-lint, type-check, bandit-check]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment file
        run: |
              cp config/env.example config/.env
              echo "Created config/.env"
      - name: Build the image
        run: docker compose build
      - name: Run tests
        run: docker compose -f docker-compose-ci.yml run api pytest --cov=. --cov-fail-under=85

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read
    steps:
    - name: Check out repo
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image tag
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      run: |
        IMAGE_TAG="$REGISTRY/$REPOSITORY:${{ github.sha }}"
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Build and Push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          PLAYWRIGHT_ENABLED=true
        tags: |
              ${{ env.IMAGE_TAG }}
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

    # Deploy over SSM rather than SSH: it reuses the OIDC role already assumed
    # above, needs no inbound port on the instance and no long-lived key. The
    # image carries the application code, so the box only needs the compose
    # file, which is shipped inline (base64) rather than copied over the wire.
    - name: Deploy via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        REGION: ${{ secrets.AWS_REGION }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        COMPOSE_B64=$(base64 -w0 docker-compose-prod.yml)

        SCRIPT=$(cat <<EOF
        set -e
        mkdir -p /home/ec2-user/cookbook/config
        cd /home/ec2-user/cookbook
        echo '$COMPOSE_B64' | base64 -d > docker-compose-prod.yml
        chown ec2-user:ec2-user docker-compose-prod.yml
        aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY
        docker compose -f docker-compose-prod.yml pull
        docker compose -f docker-compose-prod.yml up -d --remove-orphans
        docker image prune -f
        EOF
        )

        CMD_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy $SHA" \
          --parameters "$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')" \
          --query Command.CommandId --output text)
        echo "SSM command: $CMD_ID"

        # send-command is asynchronous, and the invocation is not immediately
        # queryable -- give it a moment before waiting on it.
        sleep 5
        aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

        STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
        echo "--- stdout ---"
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
        echo "--- stderr ---"
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
        echo "status: $STATUS"
        [ "$STATUS" = "Success" ]